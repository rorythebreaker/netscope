schema_version: "1.1"
name: compare-two-versions
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The agent compares the two versions with `netscope diff` (ideally with --pseudo and --audit) and
  reports: one added method, Acme.Pricing.PriceCalculator::OrderToken; one changed method,
  ApplyDiscount, which now caps the discount at 50 percent; no removed methods; and one new
  security finding, MD5 used in OrderToken (NS005). Format and Total are unchanged.
