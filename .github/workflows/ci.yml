name: ci

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Test (reference assemblies and golden output)
        run: dotnet test NetScope.sln -c Release

  publish:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Publish single-file
        run: dotnet publish src/NetScope -c Release -r ${{ matrix.rid }} -o artifacts/${{ matrix.rid }}
      - name: Smoke test
        if: matrix.rid == 'win-x64' || matrix.rid == 'linux-x64'
        shell: bash
        run: |
          exe=artifacts/${{ matrix.rid }}/netscope
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          # A real framework assembly (ReadyToRun): methods, IL and native code must work.
          linq=$(ls "$DOTNET_ROOT"/shared/Microsoft.NETCore.App/*/System.Linq.dll | head -n 1)
          "$exe" "$linq" --filter "System.Linq.Enumerable::Range" --il --native --no-color
          # A file that is not a PE image: exit code 3 (nothing could be opened).
          set +e
          "$exe" README.md --quiet
          code=$?
          set -e
          [ "$code" -eq 3 ]
      - name: Add license files
        shell: bash
        run: cp LICENSE THIRD-PARTY-NOTICES.md README.md artifacts/${{ matrix.rid }}/
      - uses: actions/upload-artifact@v7
        with:
          name: netscope-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}

  # On a version tag: package the binaries built above and publish a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Package
        shell: bash
        run: |
          cd dist
          for d in netscope-*/; do
            d=${d%/}
            name="$d-$GITHUB_REF_NAME"
            if [[ $d == *linux* ]]; then
              chmod +x "$d/netscope"            # artifacts do not keep the executable bit
              tar -czf "$name.tar.gz" -C "$d" .
            else
              (cd "$d" && zip -q -r "../$name.zip" .)
            fi
          done
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=.github/release-notes/$GITHUB_REF_NAME.md
          if [ -f "$notes" ]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt --title "NetScope $GITHUB_REF_NAME" --verify-tag "${args[@]}"
